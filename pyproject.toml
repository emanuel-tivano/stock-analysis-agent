[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "merval-equity-agent"
version = "0.1.0"
description = "Agente educativo de investigación de acciones argentinas"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
merval_agent = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires network and explicit opt-in"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
